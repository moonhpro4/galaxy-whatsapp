name: Build installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Build
        shell: bash
        run: |
          npm run build > build.log 2>&1 || { echo "::error::$(tail -n 8 build.log | tr "\n" "|" | tail -c 900)"; exit 1; }
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v1.0.${{ github.run_number }}" dist/*.exe --title "Galaxy WhatsApp Setup" --notes "Installer with setup wizard."
