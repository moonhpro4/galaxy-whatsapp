name: Build installer
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-WhatsApp-Setup
          path: dist/*.exe
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v1.0.${{ github.run_number }}" dist/*.exe --title "Galaxy WhatsApp v1.0.${{ github.run_number }}" --notes "Windows installer (setup wizard). Unofficial WhatsApp Web wrapper." --repo "${{ github.repository }}"
